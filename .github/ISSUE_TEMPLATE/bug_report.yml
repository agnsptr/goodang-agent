## CodeRabbit Rule (wajib setelah fix)

Setelah fix, buat aturan pencegahan di `docs/rules/bug-[slug].md` (WI-ENT-DEV-003):

- [ ] Aturan P0/P1 dibuat
- [ ] Severity di-set
- [ ] Do/Don't + contoh SALAH/BENAR
- [ ] Tidak ada secret
