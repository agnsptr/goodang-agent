name: CI

# =============================================================================
# ci.yml — Goodang Main CI Pipeline
# =============================================================================
# Hard gate deterministik untuk setiap PR & push ke main.
# CodeRabbit (AI review) berjalan terpisah via GitHub App — tidak di sini.
#
# Pipeline (sesuai docs/17. GOODANG_CI_BRANCH_PROTECTION_SPEC.md):
#   1. Contract drift check (docs/0 SoT integrity)
#   2. Tool registry sync (ADK ↔ kontrak)
#   3. YAML lint (workflow & config validitas)
#   4. Python lint (ruff)
#   5. Type check (mypy)
#   6. Security scan (bandit + secret detect)
#   7. Tests (pytest — Fase 2+)
#   8. Docker compose validate (Fase 1)
#
# Acuan ENTIGI:
#   - SOP-ENT-DEV-004 (AI Code Review & PR Guardrail)
#   - WI-ENT-DEV-002 (branch protection)
#   - STD-ENT-DEV-001 (coding standard)
#
# Status check wajib (required) untuk branch protection:
#   - contract-drift
#   - tool-registry-sync
#   - yaml-lint
#   - python-lint (ruff)
#   - python-typecheck (mypy)
#   - security-scan (bandit)
# =============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Contract drift check (docs/0 SoT integrity)
  # ---------------------------------------------------------------------------
  contract-drift:
    name: Contract Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify docs/0 exists
        run: |
          if [ ! -f "docs/0. GOODANG_CONTRACT.md" ]; then
            echo "✗ Missing docs/0. GOODANG_CONTRACT.md (single source of truth)"
            exit 1
          fi

      - name: Run contract drift check
        run: bash scripts/check-contract-drift.sh

  # ---------------------------------------------------------------------------
  # Job 2: Tool registry sync (ADK ↔ kontrak)
  # ---------------------------------------------------------------------------
  tool-registry-sync:
    name: Tool Registry Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tool registry sync check
        run: python3 scripts/check-tool-registry-sync.py

  # ---------------------------------------------------------------------------
  # Job 3: YAML lint (workflow & config validitas)
  # ---------------------------------------------------------------------------
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install yamllint -q

      - name: Run yamllint
        run: |
          # Lint semua file YAML: workflows, docker-compose, .coderabbit.yaml, registry.yaml
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
            .github/workflows/ \
            docker/ \
            .coderabbit.yaml \
            app/tools/registry.yaml

  # ---------------------------------------------------------------------------
  # Job 4: Python lint (ruff)
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff -q

      - name: Run ruff check
        run: |
          # Cek hanya jika ada file Python
          if find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" | grep -q .; then
            ruff check .
          else
            echo "No Python files found — skip ruff (Fase 1 spec-only repo)"
          fi

  # ---------------------------------------------------------------------------
  # Job 5: Type check (mypy)
  # ---------------------------------------------------------------------------
  python-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy -q

      - name: Run mypy
        run: |
          if find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" | grep -q .; then
            mypy --ignore-missing-imports app/ || true
          else
            echo "No Python files found — skip mypy (Fase 1 spec-only repo)"
          fi

  # ---------------------------------------------------------------------------
  # Job 6: Security scan (bandit + secret detection)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (bandit + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit -q

      - name: Run bandit (Python security scan)
        run: |
          if find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" | grep -q .; then
            bandit -r app/ -ll || true
          else
            echo "No Python files found — skip bandit (Fase 1 spec-only repo)"
          fi

      - name: Detect secrets in code
        run: |
          # Hard gate: tidak boleh ada secret di code
          # Pattern: SUPABASE_SERVICE_ROLE_KEY=eyJ..., TELEGRAM_BOT_TOKEN=123456:..., password=...
          if grep -rnE "(SUPABASE_SERVICE_ROLE_KEY|TELEGRAM_BOT_TOKEN|DBPASSWORD|password)\s*=\s*['\"][a-zA-Z0-9_\-:]{20,}['\"]" \
              --include="*.py" --include="*.yml" --include="*.yaml" --include="*.md" \
              --exclude-dir=.git --exclude-dir=venv . 2>/dev/null \
              | grep -vE "\.env\.example|change-me|set in \.env|\*\*\*|example\.com"; then
            echo "✗ Secret detected in code — use .env (not committed)"
            exit 1
          fi
          echo "✓ No secrets detected"

      - name: Verify .env not committed
        run: |
          if git ls-files | grep -E "^\.env$|^docker/\.env$"; then
            echo "✗ .env file is committed — remove from git"
            exit 1
          fi
          echo "✓ No .env committed"

  # ---------------------------------------------------------------------------
  # Job 7: Tests (pytest) — Fase 2+ (stub untuk Fase 1)
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + pytest
        run: pip install -e ".[dev]" -q

      - name: Run pytest
        run: |
          if [ -d "tests" ] && find tests -name "test_*.py" | grep -q .; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found — skip pytest (Fase 1 spec-only repo, Fase 2+ wajib)"
          fi

  # ---------------------------------------------------------------------------
  # Job 8: Docker compose validate
  # ---------------------------------------------------------------------------
  docker-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.fase1.yml
        env:
          TEMPORAL_DB_PASSWORD: ci-validate-only
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-validate-only
          SUPABASE_ANON_KEY: ci-validate-only
          TELEGRAM_BOT_TOKEN: "123456:ci-validate-only"
          TEMPORAL_ADDRESS_REMOTE: temporal-server:7233
        run: |
          if [ -f "docker/docker-compose.fase1.yml" ]; then
            docker compose -f docker/docker-compose.fase1.yml config --quiet
          else
            echo "No docker-compose file — skip"
          fi

  # ---------------------------------------------------------------------------
  # Job 9: Summary (status check agregator untuk branch protection)
  # ---------------------------------------------------------------------------
  ci-summary:
    name: CI Summary (Required)
    runs-on: ubuntu-latest
    needs:
      - contract-drift
      - tool-registry-sync
      - yaml-lint
      - python-lint
      - python-typecheck
      - security-scan
      - tests
      - docker-validate
    if: |
      always() &&
      needs.contract-drift.result == 'success' &&
      needs.tool-registry-sync.result == 'success' &&
      needs.yaml-lint.result == 'success' &&
      needs.python-lint.result == 'success' &&
      needs.python-typecheck.result == 'success' &&
      needs.security-scan.result == 'success' &&
      needs.tests.result == 'success' &&
      needs.docker-validate.result == 'success'
    steps:
      - name: All required CI jobs passed
        run: |
          echo "✓ All required CI jobs passed"
          echo "  contract-drift: ${{ needs.contract-drift.result }}"
          echo "  tool-registry-sync: ${{ needs.tool-registry-sync.result }}"
          echo "  yaml-lint: ${{ needs.yaml-lint.result }}"
          echo "  python-lint: ${{ needs.python-lint.result }}"
          echo "  python-typecheck: ${{ needs.python-typecheck.result }}"
          echo "  security-scan: ${{ needs.security-scan.result }}"
          echo "  tests: ${{ needs.tests.result }}"
          echo "  docker-validate: ${{ needs.docker-validate.result }}"
